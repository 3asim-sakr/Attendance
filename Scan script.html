<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance | تسجيل الحضور</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f1f5f9; color: #0f172a; padding: 16px;
    }
    .card {
      background: #ffffff; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    .header-row {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px;
    }
    .badge {
      display: inline-block; background: #dbeafe; color: #1d4ed8; padding: 4px 12px;
      border-radius: 99px; font-size: 0.85rem; font-weight: bold;
    }
    .brand {
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: #64748b;
    }
    h2 { margin: 0 0 6px; font-size: 1.35rem; }
    .countdown {
      font-size: 0.85rem; color: #d97706; background: #fef3c7; padding: 8px 12px;
      border-radius: 8px; margin-bottom: 18px; font-weight: 600;
    }
    label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px;
      font-size: 1rem; margin-bottom: 14px; outline: none;
    }
    input:focus { border-color: #2563eb; }
    button {
      width: 100%; padding: 13px; border: none; border-radius: 10px; background: #2563eb;
      color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer;
    }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .result {
      margin-top: 16px; padding: 14px; border-radius: 10px; font-weight: 600;
      text-align: center; display: none; line-height: 1.5;
    }
    .result.success { background: #dcfce7; color: #166534; display: block; }
    .result.error { background: #fee2e2; color: #991b1b; display: block; }
  </style>
</head>
<body>
  <div class="card" id="mainCard">
    <div class="header-row">
      <div class="badge" id="sessionBadge">جاري التحميل...</div>
      <div class="brand">Attendance</div>
    </div>
    <h2>تسجيل الحضور</h2>
    <div class="countdown" id="countdownBox">⏳ جاري حساب الوقت المتبقي...</div>

    <form id="attendanceForm" onsubmit="submitAttendance(event)">
      <label for="studentName">الاسم ثلاثي</label>
      <input type="text" id="studentName" placeholder="مثال: عاصم مصطفى محمد" required />

      <label for="studentId">الـ ID الجامعي</label>
      <input type="text" id="studentId" inputmode="numeric" placeholder="اكتب رقم الكارنيه" required />

      <button type="submit" id="submitBtn">تأكيد الحضور ✅</button>
    </form>

    <div class="result" id="resultBox"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVjhqbC8B9m1FngHB3nukUlyTF3RasmruKfrmyakIvSEr5sTq1tH6PO_oq4_7KzpF9/exec";
    const MAX_AGE_SECONDS = 45;

    const params = new URLSearchParams(window.location.search);
    const session = params.get("session");
    const ts = Number(params.get("ts"));
    const sig = params.get("sig");

    const resultBox = document.getElementById("resultBox");
    const submitBtn = document.getElementById("submitBtn");
    const countdownBox = document.getElementById("countdownBox");

    function getDeviceId() {
      let id = localStorage.getItem("att_device_id");
      if (!id) {
        id = (crypto.randomUUID)
          ? crypto.randomUUID()
          : "dev_" + Math.random().toString(36).substring(2) + Date.now();
        localStorage.setItem("att_device_id", id);
      }
      return id;
    }

    window.addEventListener("DOMContentLoaded", () => {
      if (!session || !ts || !sig) {
        document.getElementById("mainCard").innerHTML =
          `<div class="result error">⚠️ افتح الصفحة دي عن طريق عمل Scan للـ QR Code المعروض على الشاشة قدامك.</div>`;
        return;
      }

      document.getElementById("sessionBadge").textContent = "المادة / السكشن: " + session;
      document.getElementById("studentName").value = localStorage.getItem("att_name") || "";
      document.getElementById("studentId").value = localStorage.getItem("att_id") || "";

      const timer = setInterval(() => {
        const elapsed = Math.floor(Date.now() / 1000) - ts;
        const left = MAX_AGE_SECONDS - elapsed;
        if (left <= 0) {
          clearInterval(timer);
          countdownBox.textContent = "⛔ انتهت صلاحية الكود! اعمل Scan للـ QR الجديد على الشاشة.";
          countdownBox.style.background = "#fee2e2";
          countdownBox.style.color = "#991b1b";
          submitBtn.disabled = true;
        } else {
          countdownBox.textContent = `⏳ قدامك ${left} ثانية لتأكيد حضورك`;
        }
      }, 500);
    });

    async function submitAttendance(e) {
      e.preventDefault();
      const name = document.getElementById("studentName").value.trim();
      const studentId = document.getElementById("studentId").value.trim();

      if (!name || !studentId) return;

      localStorage.setItem("att_name", name);
      localStorage.setItem("att_id", studentId);

      submitBtn.disabled = true;
      submitBtn.textContent = "جاري التسجيل...";
      resultBox.className = "result";
      resultBox.style.display = "none";

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            session: session,
            ts: ts,
            sig: sig,
            name: name,
            studentId: studentId,
            deviceId: getDeviceId()
          })
        });

        const data = await response.json();
        resultBox.textContent = data.message;
        resultBox.className = "result " + (data.status === "success" ? "success" : "error");

        if (data.status !== "success") {
          submitBtn.disabled = false;
          submitBtn.textContent = "حاول مرة تانية";
        } else {
          submitBtn.textContent = "تم التسجيل ✅";
        }
      } catch (err) {
        resultBox.textContent = "مشكلة في الاتصال بالإنترنت، تأكد من الشبكة وحاول تاني.";
        resultBox.className = "result error";
        submitBtn.disabled = false;
        submitBtn.textContent = "تأكيد الحضور ✅";
      }
    }
  </script>
</body>
</html>
