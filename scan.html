<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance | شاشة تسجيل الحضور</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f172a; color: #f8fafc; padding: 20px;
    }
    .card {
      background: #1e293b; padding: 28px; border-radius: 16px; width: 100%; max-width: 440px;
      text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4);
    }
    .brand {
      display: inline-block; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: #60a5fa; background: rgba(59, 130, 246, 0.15);
      padding: 4px 12px; border-radius: 99px; margin-bottom: 10px;
    }
    h2 { margin: 0 0 8px; font-size: 1.4rem; }
    p { color: #94a3b8; font-size: 0.9rem; margin: 0 0 20px; }
    .controls { display: flex; gap: 8px; margin-bottom: 20px; }
    input {
      flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155;
      background: #0f172a; color: #fff; font-size: 1rem; text-align: center;
    }
    button {
      padding: 10px 18px; border-radius: 8px; border: none; background: #3b82f6;
      color: #fff; font-weight: bold; cursor: pointer; font-size: 0.95rem;
    }
    button.stop { background: #ef4444; }
    #qr-wrapper {
      background: #ffffff; padding: 20px; border-radius: 14px; display: inline-block;
      margin: 10px auto; box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
    }
    #qrcode img, #qrcode canvas { display: block; margin: auto; }
    .progress-bg {
      width: 100%; height: 8px; background: #334155; border-radius: 99px;
      overflow: hidden; margin-top: 18px;
    }
    .progress-bar {
      height: 100%; width: 100%; background: #22c55e; transition: width 0.2s linear;
    }
    .status-text { margin-top: 10px; font-size: 0.85rem; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Attendance</div>
    <h2>تسجيل الحضور بالـ QR</h2>
    <p>الكود بيتجدد تلقائياً كل 10 ثواني لمنع التصوير</p>

    <div class="controls">
      <input type="text" id="sessionInput" placeholder="اسم المادة / السكشن (مثال: AI_Sec5)" />
      <button id="toggleBtn" onclick="toggleSession()">ابدأ</button>
    </div>

    <div id="qr-area" style="display:none;">
      <div id="qr-wrapper">
        <div id="qrcode"></div>
      </div>
      <div class="progress-bg">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="status-text" id="timerText">يتجدد خلال 10 ثواني...</div>
    </div>
  </div>

  <script>
    const SECRET_KEY = "MySecretKey_2026_ChangeMe";
    const ROTATE_SECONDS = 10;

    let isRunning = false;
    let countdownInterval = null;
    let timeLeft = ROTATE_SECONDS;
    const qrContainer = document.getElementById("qrcode");
    const sessionInput = document.getElementById("sessionInput");

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("session")) {
      sessionInput.value = urlParams.get("session");
    }

    function toggleSession() {
      const btn = document.getElementById("toggleBtn");
      const qrArea = document.getElementById("qr-area");

      if (!isRunning) {
        const sessionName = sessionInput.value.trim();
        if (!sessionName) {
          alert("اكتب اسم المادة أو رقم السكشن الأول!");
          return;
        }
        isRunning = true;
        sessionInput.disabled = true;
        btn.textContent = "إيقاف";
        btn.classList.add("stop");
        qrArea.style.display = "block";
        generateNewQR();
        startTimer();
      } else {
        isRunning = false;
        sessionInput.disabled = false;
        btn.textContent = "ابدأ";
        btn.classList.remove("stop");
        qrArea.style.display = "none";
        clearInterval(countdownInterval);
      }
    }

    function startTimer() {
      timeLeft = ROTATE_SECONDS;
      updateProgressUI();
      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        timeLeft -= 0.2;
        if (timeLeft <= 0) {
          timeLeft = ROTATE_SECONDS;
          generateNewQR();
        }
        updateProgressUI();
      }, 200);
    }

    function updateProgressUI() {
      const pct = Math.max(0, (timeLeft / ROTATE_SECONDS) * 100);
      document.getElementById("progressBar").style.width = pct + "%";
      document.getElementById("timerText").textContent =
        `يتجدد خلال ${Math.ceil(timeLeft)} ثواني...`;
    }

    function generateNewQR() {
      const session = sessionInput.value.trim().replace(/[\\\/\?\*\[\]:]/g, "_");
      const ts = Math.floor(Date.now() / 1000);
      const sig = sha256(session + "|" + ts + "|" + SECRET_KEY).substring(0, 16);

      const scanUrl = new URL("scan.html", window.location.href);
      scanUrl.searchParams.set("session", session);
      scanUrl.searchParams.set("ts", ts);
      scanUrl.searchParams.set("sig", sig);

      qrContainer.innerHTML = "";
      new QRCode(qrContainer, {
        text: scanUrl.toString(),
        width: 240,
        height: 240,
        correctLevel: QRCode.CorrectLevel.M
      });
    }
